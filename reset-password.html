  <main>
    <section class="section">
      <div class="container">
        <h1>Choose a new password</h1>
        <form class="form" id="reset-form">
          <label>New password (12 characters minimum)<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
          <label>Confirm<input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
          <button class="btn" type="submit">Save</button>
          <p class="form-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
