<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titre du recueil</title>
<!-- Modèle de recueil Onconic Formation : fichier unique, sans ressource externe (images en data:, polices système).
     Chaque diapositive est une <section class="slide" data-title="…"> : la recherche et le lien direct à la diapositive s'appuient dessus.
     Navigation : flèches, espace, balayage, clic sur les bords ; F = plein écran ; impression = une diapositive par page. -->
<style>
:root { --navy: #001B4D; --navy-d: #00123A; --amber: #F0B12B; --ink: #1A2A4A; --ink2: #5A6478; --mist: #F2F4F8; --line: #DDE2EB; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--navy-d); }
.deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
.slide { position: absolute; inset: 0; display: none; padding: 6vh 7vw 9vh; background: #fff; overflow: auto; font-size: clamp(16px, 2.3vmin, 28px); line-height: 1.45; }
.slide.on { display: block; }
.slide h1 { font-weight: 300; font-size: 2.6em; line-height: 1.1; margin: 0 0 .4em; color: var(--navy); }
.slide h2 { font-weight: 300; font-size: 1.7em; margin: 0 0 .6em; color: var(--navy); padding-bottom: .3em; border-bottom: 3px solid var(--amber); }
.slide h3 { font-size: 1.1em; margin: 1em 0 .3em; color: var(--navy); }
.slide ul { padding-left: 1.2em; } .slide li { margin: .35em 0; }
.slide .sub { color: var(--ink2); font-size: 1.1em; }
.slide.title { background: var(--navy); color: #fff; display: none; flex-direction: column; justify-content: center; }
.slide.title.on { display: flex; }
.slide.title h1 { color: #fff; } .slide.title .sub { color: #C3CBD9; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; } @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
.key { background: #FDF4E0; border-left: 6px solid var(--amber); padding: .6em 1em; margin: 1em 0; font-weight: 500; }
table { border-collapse: collapse; width: 100%; font-size: .9em; } th, td { border-bottom: 1px solid var(--line); padding: .4em .6em; text-align: left; } th { color: var(--navy); }
.ref { font-size: .72em; color: var(--ink2); }
img, svg { max-width: 100%; height: auto; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5.5vh; min-height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: rgba(0,18,58,.92); color: #C3CBD9; font-size: 14px; z-index: 5; }
.bar button { background: none; border: 1px solid #5A6478; color: #fff; border-radius: 4px; padding: 3px 12px; font-size: 14px; cursor: pointer; min-height: 28px; }
.bar .prog { flex: 1; height: 3px; background: #1B3A76; } .bar .prog i { display: block; height: 100%; width: 0; background: var(--amber); }
@media print { html, body { height: auto; background: #fff; } .deck { overflow: visible; height: auto; } .slide { position: relative; display: block !important; page-break-after: always; min-height: 100vh; } .bar { display: none; } }
</style>
</head>
<body>
<div class="deck" id="deck">
  <section class="slide title" data-title="Titre">
    <h1>Titre du recueil</h1>
    <p class="sub">Clinique · Pathologie</p>
    <p class="sub">Auteur · JJ.MM.AAAA</p>
  </section>
  <section class="slide" data-title="Contenu type">
    <h2>Titre de la diapositive</h2>
    <ul><li>Point clé</li><li>Point clé</li></ul>
    <div class="key">Message à retenir.</div>
    <p class="ref">Auteur et al., Revue année. PMID 00000000.</p>
  </section>
</div>
<div class="bar"><button id="prev" type="button" aria-label="Précédent">←</button><span id="cnt"></span><div class="prog"><i id="pg"></i></div><button id="next" type="button" aria-label="Suivant">→</button><button id="fs" type="button">Plein écran</button></div>
<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll(".slide")), i = 0;
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle("on", k === i); });
    document.getElementById("cnt").textContent = (i + 1) + " / " + slides.length;
    document.getElementById("pg").style.width = ((i + 1) / slides.length * 100) + "%";
    slides[i].scrollTop = 0;
  }
  document.getElementById("prev").onclick = function () { show(i - 1); };
  document.getElementById("next").onclick = function () { show(i + 1); };
  document.getElementById("fs").onclick = function () { var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); };
  document.addEventListener("keydown", function (e) {
    if (["ArrowRight", "PageDown", " "].indexOf(e.key) > -1) { e.preventDefault(); show(i + 1); }
    else if (["ArrowLeft", "PageUp"].indexOf(e.key) > -1) { e.preventDefault(); show(i - 1); }
    else if (e.key === "Home") show(0); else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") document.getElementById("fs").click();
  });
  var x0 = null;
  document.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
  window.addEventListener("message", function (e) { var m = e.data || {}; if (m.type === "goto") show(m.n - 1); });
  show(0);
})();
</script>
</body>
</html>
