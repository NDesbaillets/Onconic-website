          <label>Nouveau mot de passe (12 caractères minimum)<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>

          <button class="btn" type="submit">Enregistrer</button>
          <p class="form-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
